[project]
# Only needed so uv/pip recognizes it as a project
name = "notebooks-to-explore"
version = "0.0.0"
description = "Notebooks de formation LangChain + Mistral AI (Jour 2 — Hands On L1/Atelier à L9)"
# Jour 2 verrouille Python 3.13 (couvert par LangGraph 1.x). Le .venv racine (Jour 1)
# reste en 3.12 et n'est jamais touché : chaque journée a son environnement.
requires-python = ">=3.13,<3.14"

# Dépendances réellement utilisées par les notebooks L1/Atelier -> L9.
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langchain-mistralai>=1.0",
    "langchain-mcp-adapters>=0.3",
    "langgraph-cli[inmem]>=0.4.0",
    "sqlalchemy>=2.0",
    "python-dotenv",
    "packaging",
    "pydantic>=2.0",
    "jupyter>=1.0.0",
    "ipykernel",
    "nbclient",
    "nbformat",
]

[project.optional-dependencies]
# Outils de développement / validation des notebooks.
dev = [
    "nbdime>=4.0.2",
    "ruff>=0.6.1",
]

# CVE-2026-32597: PyJWT <=2.11.0 accepts unknown crit header extensions.
# CVE-2026-4539: Pygments <2.20.0 has ReDoS via GUID matching regex.
# GHSA-rpm5-65cw-6hj4 / GHSA-x2qx-6953-8485: GitPython <3.1.47 command injection via Git options bypass.
# Remove these constraints once the parent packages pull in fixed versions.
[tool.uv]
constraint-dependencies = [
    "pyjwt>=2.12.0",
    "pygments>=2.20.0",
    "gitpython>=3.1.47",
]

[tool.ruff]
# What to check
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # docstring first line imperative
    "UP",   # pyupgrade
]

# Rules to ignore
lint.ignore = [
    "T201", # allow print()
    "UP006", # keep using typing.List etc.
    "UP007", # allow Union[X, Y]
    "UP035", # ignore Self type suggestion
    "D417",  # don't require param docs
    "E501",  # ignore line length
    "D101",  # ignore docstring for these labs
    "D103",  # ignore docstring for these labs
    "D202",  # ignore extra space after docstring requirement
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"
