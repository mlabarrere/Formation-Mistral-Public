[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formation-mistral"
version = "0.1.0"
description = "Environnement Python de la formation Mistral CD39"
requires-python = ">=3.13"
dependencies = [
    # ── LangChain / LangGraph ecosystem ─────────────────────────────────────────
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-community>=0.3",
    "langchain-mistralai>=1.0",
    "langgraph>=1.0",
    "langchain-mcp-adapters>=0.3",
    "langgraph-cli[inmem]>=0.4.0",
    # ── Mistral ──────────────────────────────────────────────────────────────────
    "mistralai>=2.0",
    "mistralai-workflows>=3.0",
    # ── Évaluation (J1 T1a, J3 T2) ──────────────────────────────────────────────────
    "ragas>=0.4",
    "litellm>=1.0",
    "instructor>=1.0",
    # ── LlamaIndex (J1) ──────────────────────────────────────────────────────────
    "llama-index-core",
    "llama-index-llms-mistralai",
    # ── Domaine et visualisation ─────────────────────────────────────────────────
    "gpxpy>=1.0",
    "networkx>=3.0",
    "matplotlib>=3.0",
    "pandas>=2.0",
    "requests>=2.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "fastmcp",
    # ── RAG / GraphRAG (J3 T2) ───────────────────────────────────────────────────
    "langchain-chroma>=1.0",
    "langchain-qdrant>=1.0",
    "rank-bm25>=0.2",
    "datasets>=4.0",   # J3 T3 : Dataset.from_list, seule dépendance FT exécutée en salle
    "numpy>=2.0",
    # ── Utilitaires ──────────────────────────────────────────────────────────────
    "python-dotenv",
    "packaging",
    # ── Exécution des notebooks ──────────────────────────────────────────────────
    "jupyter>=1.0",
    "ipykernel",
    "nbclient",
    "nbformat",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[tool.hatch.build.targets.wheel]
include = [
    "J0_Prerequisites/**",
    "J1_Fondations/**",
    "J2_Hands On/**",
    "J3_Avancé/**",
    "README.md",
]

[tool.uv]
# CVE-2026-32597: PyJWT <=2.11.0 accepts unknown crit header extensions.
# CVE-2026-4539: Pygments <2.20.0 has ReDoS via GUID matching regex.
# GHSA-rpm5-65cw-6hj4: GitPython <3.1.47 command injection via Git options bypass.
constraint-dependencies = [
    "pyjwt>=2.12.0",
    "pygments>=2.20.0",
    "gitpython>=3.1.47",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
reportUnusedExpression = "none"

[project.optional-dependencies]
dev = [
    "nbdime>=4.0.2",
    "ruff>=0.6.1",
]
# J3 T3 : la partie 3 du notebook Fine-tuning. Non installé par défaut (~2,5 Go).
# La pile entière est épinglée ensemble : épingler trl seul ne sert à rien, il
# déclare transformers>=… sans borne haute et laisse le résolveur prendre la dernière.
finetuning = [
    "torch>=2.6",
    "transformers>=4.56",   # dtype= remplace torch_dtype= à partir de cette version
    "trl>=0.20",            # max_seq_length supprimé de SFTConfig ici : le notebook utilise max_length
    "peft>=0.15",
    "accelerate>=1.4",
]

[tool.ruff]
lint.select = ["E", "F", "I", "D", "D401", "UP"]
lint.ignore = ["T201", "UP006", "UP007", "UP035", "D417", "E501", "D101", "D103", "D202"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"
