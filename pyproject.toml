[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formation-mistral"
version = "0.1.0"
description = "Environnement Python de la formation Mistral CD39"
requires-python = ">=3.12"
dependencies = [
    # ── Contrainte structurante ───────────────────────────────────────────────
    # langchain-core DOIT rester en 0.3.x : les lignes 1.x exigent
    # langchain-core>=1.4.7, qui casse ragas (utilisé par T1a et T4).
    "langchain-core==0.3.86",
    "langgraph==0.6.11",
    "langchain-mistralai==0.2.12",

    # ── Mistral ───────────────────────────────────────────────────────────────
    "mistralai==2.9.4",
    "mistralai-workflows==3.11.0",

    # ── Évaluation (T1a, T4) ─────────────────────────────────────────────────
    "litellm==1.98.0",
    "instructor==1.16.0",

    # ── Domaine et visualisation ──────────────────────────────────────────────
    "gpxpy==1.6.2",
    "networkx==3.6.1",
    "matplotlib==3.11.1",
    "pandas==3.0.5",
    "requests==2.34.2",
    "pydantic==2.13.5",

    # ── Exécution des notebooks ───────────────────────────────────────────────
    "ipykernel==7.3.0",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
]

[tool.hatch.build.targets.wheel]
# Pas de code source à packager : le projet est un environnement de formation.
# On exclut tout sauf les notebooks et les assets.
include = [
    "J0_Prerequisites/**",
    "J1_Fondations/**",
    "J2_Hands On/**",
    "README.md",
]
